appId: gg.reliquary.client
productName: Reliquary
directories:
  output: release
files:
  - out/**
  - package.json
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: true # install to Program Files (admin) — lets the Tauri web installer
  # run this silently to a chosen dir (/S /D=…) and keeps electron-updater consistent
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
# Auto-update feed. electron-builder generates latest.yml + embeds app-update.yml
# from this block so installed clients know where to look. Public repo releases
# download with NO token in the app; a GH_TOKEN is only needed at publish time
# (npm run release). To self-host instead, swap to: { provider: generic, url: https://… }.
# ⚠️ Replace `owner` with your GitHub username before the first `npm run release`.
publish:
  provider: github
  owner: HPelto
  repo: Reliquary
  # publish straight to a public (non-draft) release so the web installer's
  # /releases/latest lookup and electron-updater both see it immediately
  releaseType: release
